<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Monastery360</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF9933" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/globals.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <style>
    body { 
      background: linear-gradient(rgba(13, 8, 0, 0.6), rgba(13, 8, 0, 0.8)), url('images/hero.png') center/cover no-repeat fixed; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; z-index: 10; position: relative; }
    .auth-card { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-xl); 
      box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
      max-width: 440px; 
      width: 100%; 
      overflow: hidden; 
      position: relative; 
    }
    .auth-header { background: var(--deep); color: white; padding: 40px 30px; text-align: center; position: relative; overflow: hidden; }
    .auth-header::before { content: '☸️'; position: absolute; font-size: 160px; right: -30px; top: -30px; opacity: 0.05; }
    .auth-header h1 { font-family: var(--font-heading); font-size: 2rem; margin-bottom: 8px; }
    .auth-header p { font-size: 0.95rem; color: rgba(255,255,255,0.7); }
    .auth-body { padding: 40px 30px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--cream-dark); margin-bottom: 24px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
    .auth-tab.active { color: var(--saffron-dark); border-bottom-color: var(--saffron); }
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: slideUp 0.3s ease; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-group input { width: 100%; border: 2px solid var(--cream-dark); border-radius: var(--radius-md); padding: 12px 16px; font-family: var(--font-main); font-size: 1rem; transition: border-color 0.3s; }
    .form-group input:focus { outline: none; border-color: var(--saffron); box-shadow: 0 0 0 4px rgba(255,153,51,0.1); }
    .auth-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-md); background: var(--saffron); color: white; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
    .auth-btn:hover { background: var(--saffron-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,153,51,0.3); }
    .auth-error { color: #d71920; font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px; text-align: center; display: none; font-weight: 600; }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar" style="background: transparent; position: relative; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="container navbar-inner">
      <a href="index.html" class="nav-logo" style="color: white;">
        <div class="logo-icon">☸️</div>
        Monastery<span style="color:var(--saffron)">360</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" style="color: white; opacity: 0.9;">🏠 Home</a></li>
        <li><a href="tours.html" style="color: white; opacity: 0.9;">🎥 360° Tours</a></li>
        <li><a href="stay.html" style="color: white; opacity: 0.9;">🏨 Booking</a></li>
      </ul>
      <div class="nav-actions">
        <!-- Auth.js will inject button here -->
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your bookings and travel history.</p>
      </div>
      <div class="auth-body">
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="switchTab('signin')">Sign In</div>
          <div class="auth-tab" onclick="switchTab('signup')">Create Account</div>
        </div>

        <div id="auth-notice" style="display:none;background:rgba(255,153,51,0.12);border:1px solid rgba(255,153,51,0.3);padding:10px 14px;border-radius:var(--radius-md);margin-bottom:16px;font-size:0.85rem;color:var(--saffron-dark);text-align:center;font-weight:600"></div>
        <div id="auth-error" class="auth-error"></div>

        <!-- SignIn Form -->
        <form class="auth-form active" id="form-signin" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="si-email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="si-pass" placeholder="••••••••" required />
          </div>
          <button type="submit" class="auth-btn">Sign In to Continue</button>

          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--cream-dark);text-align:center">
            <button type="button" onclick="fillDemoCredentials()" style="background:none;border:none;color:var(--saffron-dark);font-size:0.85rem;font-weight:600;cursor:pointer;text-decoration:underline">
              ⚡ Quick Fill: Demo Account (Tenzin Gyatso)
            </button>
          </div>
        </form>

        <!-- SignUp Form -->
        <form class="auth-form" id="form-signup" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="su-name" placeholder="Tenzin Gyatso" required />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="su-email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="su-pass" placeholder="Create a password" required />
          </div>
          <button type="submit" class="auth-btn">Create Account & Unlock Project</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect') || 'tours.html';
    const initialMode = urlParams.get('mode');
    const noticeMsg = urlParams.get('msg');

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById('auth-error').style.display = 'none';

      if(tab === 'signin') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('form-signin').classList.add('active');
        document.querySelector('.auth-header h1').textContent = 'Welcome Back';
        document.querySelector('.auth-header p').textContent = 'Sign in to access your sacred journey, bookings, and virtual tours.';
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('form-signup').classList.add('active');
        document.querySelector('.auth-header h1').textContent = 'Join Monastery360';
        document.querySelector('.auth-header p').textContent = 'Create a free account to unlock the full Monastery360 experience.';
      }
    }

    function fillDemoCredentials() {
      document.getElementById('si-email').value = 'tenzin@example.com';
      document.getElementById('si-pass').value = 'password123';
      document.getElementById('auth-error').style.display = 'none';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('si-email').value;
      const pass = document.getElementById('si-pass').value;
      const res = Auth.login(email, pass);
      if(res.error) {
        const err = document.getElementById('auth-error');
        err.textContent = res.error;
        err.style.display = 'block';
      } else {
        window.location.href = redirectTarget;
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('su-name').value;
      const email = document.getElementById('su-email').value;
      const pass = document.getElementById('su-pass').value;
      const res = Auth.register(name, email, pass);
      if(res.error) {
        const err = document.getElementById('auth-error');
        err.textContent = res.error;
        err.style.display = 'block';
      } else {
        window.location.href = redirectTarget;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (noticeMsg) {
        const noticeEl = document.getElementById('auth-notice');
        noticeEl.textContent = decodeURIComponent(noticeMsg);
        noticeEl.style.display = 'block';
      }

      if (initialMode === 'signup') {
        switchTab('signup');
      }

      // If user is already logged in, redirect them to the destination
      if (Auth.getCurrentUser()) {
        window.location.href = redirectTarget;
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
