<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – Monastery360</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF9933" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/globals.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <script src="js/auth.js"></script>
  <script>
    if (typeof Auth !== 'undefined' && !Auth.requireAuth('Please sign in or create an account to view your profile dashboard.')) {
      window.stop && window.stop();
    }
  </script>
  <style>
    body { background: var(--cream); min-height: 100vh; }
    .profile-header { background: linear-gradient(135deg, var(--deep) 0%, #1a0f00 100%); color: white; padding: 60px 0 40px; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--saffron); color: white; font-size: 2rem; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 4px solid rgba(255,153,51,0.3); }
    .profile-title { font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 5px; }
    .profile-email { color: rgba(255,255,255,0.7); font-size: 1rem; }
    
    .dashboard-layout { display: flex; gap: 30px; margin-top: -30px; margin-bottom: 60px; }
    @media(max-width: 768px) { .dashboard-layout { flex-direction: column; } }
    
    .dashboard-sidebar { width: 280px; flex-shrink: 0; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 10px; height: fit-content; }
    .dash-tab { display: flex; align-items: center; gap: 12px; padding: 14px 20px; font-weight: 600; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-md); transition: all 0.2s; }
    .dash-tab:hover { background: var(--cream); }
    .dash-tab.active { background: rgba(255,153,51,0.1); color: var(--saffron-dark); }
    
    .dashboard-content { flex: 1; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 30px; min-height: 400px; }
    .dash-panel { display: none; animation: fadeIn 0.3s ease; }
    .dash-panel.active { display: block; }
    .panel-title { font-family: var(--font-heading); font-size: 1.6rem; color: var(--deep); margin-bottom: 24px; border-bottom: 2px solid var(--cream-dark); padding-bottom: 12px; }
    
    /* List styles */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.95rem; }
    
    .history-card { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid var(--cream-dark); border-radius: var(--radius-md); margin-bottom: 16px; }
    .history-card:hover { border-color: var(--saffron-light); background: rgba(255,153,51,0.02); }
    .hc-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .hc-info { flex: 1; }
    .hc-title { font-weight: 700; color: var(--text-primary); font-size: 1.05rem; margin-bottom: 4px; }
    .hc-meta { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 12px; }
    .hc-status { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: rgba(52,168,83,0.1); color: #2e8b4e; }
    
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">☸️</div>
        Monastery<span style="color:var(--saffron)">360</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="tours.html">🎥 360° Tours</a></li>
        <li><a href="stay.html">🏨 Booking</a></li>
      </ul>
      <div class="nav-actions">
        <!-- Auth wrapper replaces this -->
      </div>
    </div>
  </nav>

  <header class="profile-header">
    <div class="container">
      <div class="profile-avatar" id="userAvatar">🧘</div>
      <h1 class="profile-title" id="userName">User Name</h1>
      <p class="profile-email" id="userEmail">user@example.com</p>
    </div>
  </header>

  <div class="container dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="dash-tab active" onclick="switchPanel('bookings')">🏨 My Bookings</div>
      <div class="dash-tab" onclick="switchPanel('visits')">🎥 Virtual Tours History</div>
      <div class="dash-tab" onclick="switchPanel('plans')">📋 Saved Plans</div>
    </aside>
    
    <main class="dashboard-content">
      <!-- Bookings Panel -->
      <div class="dash-panel active" id="panel-bookings">
        <h2 class="panel-title">My Bookings</h2>
        <div id="bookingsList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <!-- Visits Panel -->
      <div class="dash-panel" id="panel-visits">
        <h2 class="panel-title">Recently Explored Monasteries</h2>
        <div id="visitsList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <!-- Saved Plans Panel -->
      <div class="dash-panel" id="panel-plans">
        <h2 class="panel-title">My Saved Trip Plans</h2>
        <div id="plansList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/pano_b64.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function formatDate(isoString) {
      const d = new Date(isoString);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function switchPanel(panelName) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dash-panel').forEach(p => p.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('panel-' + panelName).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // Populate Header
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();

      // Populate Bookings
      const bList = document.getElementById('bookingsList');
      if (user.bookings.length === 0) {
        bList.innerHTML = `<div class="empty-state">No bookings found.<br><br><a href="stay.html" class="btn btn-outline" style="margin-top:10px">Find Hotels</a></div>`;
      } else {
        bList.innerHTML = user.bookings.map(b => {
          let icon = b.type === 'hotel' ? '🏨' : b.type === 'flight' ? '✈️' : '🚌';
          let bg = b.type === 'hotel' ? '#fb8c00' : '#4285F4';
          return `
            <div class="history-card">
              <div class="hc-icon" style="background:rgba(0,0,0,0.05)">${icon}</div>
              <div class="hc-info">
                <div class="hc-title">${b.title}</div>
                <div class="hc-meta">
                  <span>💰 ${b.price || 'N/A'}</span>
                  <span>📅 Booked on ${formatDate(b.date)}</span>
                </div>
              </div>
              <div class="hc-status">${b.status || 'Success'}</div>
            </div>`;
        }).join('');
      }

      // Populate Visits
      const vList = document.getElementById('visitsList');
      if (user.visits.length === 0) {
        vList.innerHTML = `<div class="empty-state">You haven't explored any monasteries yet.<br><br><a href="tours.html" class="btn btn-outline" style="margin-top:10px">Start Exploring</a></div>`;
      } else {
        vList.innerHTML = user.visits.map(v => `
          <div class="history-card">
            <div class="hc-icon" style="background:var(--cream-dark)">🏔️</div>
            <div class="hc-info">
              <div class="hc-title">${v.name}</div>
              <div class="hc-meta">
                <span>👁️ Visited on ${formatDate(v.date)}</span>
              </div>
            </div>
            <a href="tours.html?id=${v.id}" class="btn btn-primary" style="padding:4px 12px;font-size:0.8rem">Revisit</a>
          </div>
        `).join('');
      }

      // Populate Saved Plans
      const pList = document.getElementById('plansList');
      const plans = Auth.getPlans();
      if (plans.length === 0) {
        pList.innerHTML = `<div class="empty-state">No saved plans yet.<br><br><a href="stay.html#trip-planner" class="btn btn-outline" style="margin-top:10px">Create a Trip Plan</a></div>`;
      } else {
        pList.innerHTML = plans.map(p => {
          const stopNames = (p.stops || []).map(sid => {
            const m = window.M360Data?.monasteries.find(x => x.id === sid);
            return m ? m.name : sid;
          }).join(' → ');
          return `
            <div class="history-card">
              <div class="hc-icon" style="background:rgba(255,153,51,0.1)">📋</div>
              <div class="hc-info">
                <div class="hc-title">${p.name}</div>
                <div class="hc-meta">
                  <span>🏯 ${stopNames}</span>
                </div>
                <div class="hc-meta" style="margin-top:4px">
                  <span>🚶 ${p.pace} pace</span>
                  <span>💰 ₹${(p.estimatedCost || 0).toLocaleString()}</span>
                  <span>📅 ${formatDate(p.createdAt)}</span>
                </div>
              </div>
              <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.78rem" onclick="deletePlan('${p.id}')">🗑️</button>
            </div>`;
        }).join('');
      }
    });

    function deletePlan(planId) {
      if (confirm('Delete this plan?')) {
        Auth.deletePlan(planId);
        location.reload();
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
